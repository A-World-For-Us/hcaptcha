# Copied from the Elixir workflows of A-World-For-Us/common-ci, which is private. A public
# repository cannot call reusable workflows from a private one:
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#access-to-reusable-workflows
name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  elixir:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Elixir floor (compile and test)
            latest: false
          - name: Elixir latest (validate and test)
            latest: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Elixir (floor)
        if: ${{ !matrix.latest }}
        id: beam-floor
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.1.1"
          version-type: strict

      - name: Install Elixir (latest)
        if: ${{ matrix.latest }}
        id: beam-latest
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore dependencies & _build cache
        id: mix-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mix-${{ runner.os }}-${{ steps.beam-floor.outputs.elixir-version || steps.beam-latest.outputs.elixir-version }}-${{ steps.beam-floor.outputs.otp-version || steps.beam-latest.outputs.otp-version }}-${{ hashFiles('.tool-versions', '**/mix.lock') }}-${{ github.run_id }}
          restore-keys: mix-${{ runner.os }}-${{ steps.beam-floor.outputs.elixir-version || steps.beam-latest.outputs.elixir-version }}-${{ steps.beam-floor.outputs.otp-version || steps.beam-latest.outputs.otp-version }}-
          path: |
            deps
            _build

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Compile project and dependencies
        run: mix compile --warnings-as-errors

      - name: Save dependencies & _build cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.mix-cache.outputs.cache-primary-key }}
          path: |
            deps
            _build

      - name: Look out for unused dependencies
        if: matrix.latest
        run: mix deps.unlock --check-unused

      - name: Check formatting
        if: matrix.latest
        run: mix format --check-formatted

      - name: Run Credo
        if: matrix.latest
        run: mix credo

      - name: Restore PLT cache
        if: matrix.latest
        id: plt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: plt-${{ runner.os }}-${{ steps.beam-latest.outputs.otp-version }}-${{ steps.beam-latest.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: plt-${{ runner.os }}-${{ steps.beam-latest.outputs.otp-version }}-${{ steps.beam-latest.outputs.elixir-version }}-
          path: priv/plts

      - name: Create PLTs
        if: matrix.latest && steps.plt-cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Save PLT cache
        if: matrix.latest && steps.plt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: plt-${{ runner.os }}-${{ steps.beam-latest.outputs.otp-version }}-${{ steps.beam-latest.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          path: priv/plts

      - name: Run Dialyzer
        if: matrix.latest
        run: mix dialyzer --format github

      - name: Run tests
        run: mix test --warnings-as-errors

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install dependencies
        run: mix deps.get

      - name: Check documentation
        run: mix docs --warnings-as-errors

  js:
    name: JavaScript
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  zizmor:
    name: Audit with zizmor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/
          advanced-security: false
