name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  validate-and-test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17.3"
            otp: "27.1.1"
            lint: false
          - elixir: "1.20.4"
            otp: "29.0.6"
            lint: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Elixir
        id: elixir-install
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: strict

      - name: Restore dependencies and build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ steps.elixir-install.outputs.elixir-version }}-${{ steps.elixir-install.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ steps.elixir-install.outputs.elixir-version }}-${{ steps.elixir-install.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Check compilation
        run: mix compile --warnings-as-errors

      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - name: Run tests
        run: mix test

      - name: Run Credo
        if: matrix.lint
        run: mix credo --strict

      - name: Restore PLT cache
        if: matrix.lint
        id: plt-cache
        uses: actions/cache/restore@v4
        with:
          key: plt-${{ runner.os }}-${{ steps.elixir-install.outputs.otp-version }}-${{ steps.elixir-install.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-${{ steps.elixir-install.outputs.otp-version }}-${{ steps.elixir-install.outputs.elixir-version }}-
          path: priv/plts

      - name: Create PLTs
        if: matrix.lint && steps.plt-cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Save PLT cache
        if: matrix.lint && steps.plt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.plt-cache.outputs.cache-primary-key }}
          path: priv/plts

      - name: Run Dialyzer
        if: matrix.lint
        run: mix dialyzer --format github

      - name: Check documentation
        if: matrix.lint
        env:
          MIX_ENV: dev
        run: |
          mix deps.get
          mix docs --warnings-as-errors
